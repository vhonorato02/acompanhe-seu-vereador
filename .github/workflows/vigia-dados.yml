# Watchdog for the public data, three times a day (GitHub may drop a scheduled run; three
# chances keep a real outage from going unnoticed). Reads the published manifest and the VPS
# copy once each and, when the collection is older than LIMITE_HORAS, carries warnings, cannot
# be read, or the VPS copy is down or stale, opens (or updates) an issue labelled
# "dados-desatualizados". GitHub e-mails the owner about new issues. When everything is fine
# again, it closes the open issue with a note.
name: vigia-dados

on:
  schedule:
    # 06h43, 14h43 and 22h43 in Brasília.
    - cron: "43 1,9,17 * * *"
  workflow_dispatch:
    inputs:
      limite_horas:
        description: "Idade máxima da coleta, em horas (use 0 para testar a abertura da issue)"
        default: "26"

permissions:
  contents: read
  issues: write

env:
  SITE: https://acompanhe-seu-vereador.vercel.app
  ROTULO: dados-desatualizados
  # Refreshes run about every 12 h: 26 h means two missed in a row, plus margin.
  LIMITE_HORAS: ${{ inputs.limite_horas || '26' }}
  COPIA_VPS: https://vereador.zewithane.vps.brz.dev.br

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the published manifest
        id: checar
        run: |
          ler() { curl -sS -m 30 -A "vigia-dados (+https://github.com/${GITHUB_REPOSITORY})" "$SITE/dados/manifesto.json" || true; }
          manifesto=$(ler)
          if ! printf '%s' "$manifesto" | jq -e '.execucao.coletadoEm' > /dev/null 2>&1; then
            # A single retry, spaced out: rapid repeats get a bot challenge.
            sleep 120
            manifesto=$(ler)
          fi
          problemas=""
          if ! printf '%s' "$manifesto" | jq -e '.execucao.coletadoEm' > /dev/null 2>&1; then
            problemas="- Não consegui ler $SITE/dados/manifesto.json (resposta vazia, erro ou desafio anti-robô)."
          else
            coletado=$(printf '%s' "$manifesto" | jq -r '.execucao.coletadoEm')
            # Compared in minutes so limite_horas=0 also catches a collection under an hour old.
            minutos=$(( ( $(date -u +%s) - $(date -u -d "$coletado" +%s) ) / 60 ))
            horas=$(( minutos / 60 ))
            avisos=$(printf '%s' "$manifesto" | jq -r '.execucao.avisos // [] | .[] | "- Aviso da coleta: " + (if type == "string" then . else tojson end)')
            echo "Coleta publicada: $coletado (há $horas h $(( minutos % 60 )) min)"
            if [ "$minutos" -gt $(( LIMITE_HORAS * 60 )) ]; then
              problemas="- A última coleta publicada é de $coletado, há $horas horas (limite: $LIMITE_HORAS h). A atualização automática (workflow atualizar-dados) pode estar falhando."
            fi
            # The VPS copy mirrors the canonical site after each refresh.
            vps=$(curl -sS -m 30 -A "vigia-dados (+https://github.com/${GITHUB_REPOSITORY})" "$COPIA_VPS/api/health" | jq -r '.coletadoEm // empty' 2>/dev/null || true)
            if [ -z "$vps" ]; then
              problemas=$(printf '%s\n%s' "$problemas" "- A cópia da VPS ($COPIA_VPS) não respondeu em /api/health." | sed '/^$/d')
            else
              atraso=$(( ( $(date -u -d "$coletado" +%s) - $(date -u -d "$vps" +%s) ) / 60 ))
              echo "Cópia da VPS: coleta de $vps (atraso de $((atraso / 60)) h em relação à Vercel)"
              if [ "$atraso" -gt $(( LIMITE_HORAS * 60 )) ]; then
                problemas=$(printf '%s\n%s' "$problemas" "- A cópia da VPS está com a coleta de $vps, $((atraso / 60)) h atrás da Vercel (workflow deploy-vps)." | sed '/^$/d')
              fi
            fi
            if [ -n "$avisos" ]; then
              problemas=$(printf '%s\n%s' "$problemas" "$avisos" | sed '/^$/d')
            fi
          fi
          {
            echo "problemas<<FIM"
            echo "$problemas"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBLEMAS: ${{ steps.checar.outputs.problemas }}
        run: |
          gh label create "$ROTULO" --color B60205 --description "Aberta pelo vigia quando os dados publicados ficam velhos ou com aviso" --force > /dev/null
          aberta=$(gh issue list --label "$ROTULO" --state open --limit 1 --json number --jq '.[0].number // empty')
          execucao="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$(printf '%s' "$PROBLEMAS" | tr -d '[:space:]')" ]; then
            corpo="O vigia diário encontrou problema nos dados publicados em $SITE:

          $PROBLEMAS

          O que fazer: veja o último build de produção na Vercel (projeto acompanhe-seu-vereador → Deployments) e as execuções do workflow \`atualizar-dados\`. Passo a passo em \`docs/operacao/atualizar-dados.md\`.

          Execução do vigia: $execucao"
            corpo=$(printf '%s\n' "$corpo" | sed 's/^          //')
            if [ -n "$aberta" ]; then
              gh issue comment "$aberta" --body "$corpo"
              echo "Issue #$aberta atualizada."
            else
              gh issue create --title "Dados do portal desatualizados ou com aviso" --label "$ROTULO" --body "$corpo"
            fi
          elif [ -n "$aberta" ]; then
            gh issue close "$aberta" --comment "Resolvido: a coleta publicada voltou a estar em dia e sem avisos. Execução: $execucao"
            echo "Issue #$aberta fechada."
          else
            echo "Dados em dia, nenhuma issue aberta."
          fi
