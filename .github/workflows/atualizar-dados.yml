# Refreshes the public data about twice a day without anyone opening the Vercel dashboard.
# The collector only runs inside the Vercel production build (the Câmara token lives there),
# so "updating" means starting a new production build with the build cache: the collection
# is incremental (about 60 requests, about 2 minutes) and a full one happens every 30 days.
#
# Why hourly: GitHub delays or drops scheduled runs under load (the first 18h17 run of
# 07/11/2026 never happened). Every hour a cheap check reads the published manifest and
# only triggers a build when the collection is older than IDADE_MINIMA_H and this workflow
# did not trigger one in the last INTERVALO_FALHA_H hours (so a failing Câmara is retried every few hours,
# not every hour). A dropped run is therefore made up within the next hour.
#
# Trigger: the VERCEL_DEPLOY_HOOK_URL secret when it exists; otherwise a one-line commit to
# .github/atualizacao-agendada, authored by the owner so the Vercel Git integration builds it.
# quality-gates ignores that path, so the commit costs no CI run.
name: atualizar-dados

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

env:
  SITE: https://acompanhe-seu-vereador.vercel.app
  # Job-level so the step `if` can see whether it is set; GitHub masks it in logs.
  HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
  IDADE_MINIMA_H: "11"
  INTERVALO_FALHA_H: "3"

jobs:
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      disparar: ${{ steps.decisao.outputs.disparar }}
    steps:
      - name: Is a refresh due?
        id: decisao
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "Disparo manual: atualizar agora."; echo "disparar=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          agora=$(date -u +%s)
          coletado=$(curl -sS -m 30 -A "atualizar-dados (+https://github.com/${GITHUB_REPOSITORY})" "$SITE/dados/manifesto.json" | jq -r '.execucao.coletadoEm // empty' 2>/dev/null || true)
          if [ -z "$coletado" ]; then
            # Unreadable manifest: do not hammer; the watchdog reports it.
            echo "Manifesto ilegível agora; tento na próxima hora."; echo "disparar=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          idade_min=$(( (agora - $(date -u -d "$coletado" +%s)) / 60 ))
          # Last time this workflow actually triggered a build (works with the hook or the commit).
          ultimo=""
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/atualizar-dados.yml/runs?per_page=12" --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" 2>/dev/null || true); do
            ultimo=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "disparar" and .conclusion != "skipped" and .started_at != null) | .started_at' 2>/dev/null | head -1 || true)
            [ -n "$ultimo" ] && break
          done
          if [ -n "$ultimo" ]; then desde_ultimo_min=$(( (agora - $(date -u -d "$ultimo" +%s)) / 60 )); else desde_ultimo_min=999999; fi
          echo "Coleta publicada há $((idade_min / 60)) h $((idade_min % 60)) min; último disparo há $((desde_ultimo_min / 60)) h."
          if [ "$idade_min" -ge $(( IDADE_MINIMA_H * 60 )) ] && [ "$desde_ultimo_min" -ge $(( INTERVALO_FALHA_H * 60 )) ]; then
            echo "disparar=1" >> "$GITHUB_OUTPUT"
          else
            echo "Nada a fazer nesta hora."; echo "disparar=0" >> "$GITHUB_OUTPUT"
          fi

  disparar:
    needs: decidir
    if: needs.decidir.outputs.disparar == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Read the published collection date (before)
        id: antes
        run: |
          coletado=$(curl -sS -m 30 -A "atualizar-dados (+https://github.com/${GITHUB_REPOSITORY})" "$SITE/dados/manifesto.json" | jq -r '.execucao.coletadoEm // empty' 2>/dev/null || true)
          echo "coletado=${coletado}" >> "$GITHUB_OUTPUT"
          echo "Coleta publicada antes: ${coletado:-desconhecida}"

      - name: Trigger with the deploy hook
        id: hook
        if: env.HOOK != ''
        run: |
          curl -fsS -m 30 -X POST "$HOOK" > /dev/null
          echo "usado=1" >> "$GITHUB_OUTPUT"
          echo "Deploy hook acionado."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.hook.outputs.usado != '1'
        with:
          ref: main

      - name: Trigger with a one-line commit (no deploy hook configured)
        if: steps.hook.outputs.usado != '1'
        run: |
          git config user.name "José Victor Honorato"
          git config user.email "33707633+vhonorato02@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/atualizacao-agendada
          git add .github/atualizacao-agendada
          git commit -m "chore(data): scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)" \
            -m "Starts a Vercel production build so the collector fetches what the Câmara published since the last run."
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Não consegui enviar o commit de atualização."; exit 1

      - name: Wait for the new collection to be published
        env:
          ANTES: ${{ steps.antes.outputs.coletado }}
        run: |
          # One request every 3 minutes: the site answers rapid repeats with a bot challenge.
          for i in $(seq 1 11); do
            sleep 180
            manifesto=$(curl -sS -m 30 -A "atualizar-dados (+https://github.com/${GITHUB_REPOSITORY})" "$SITE/dados/manifesto.json" || true)
            agora=$(printf '%s' "$manifesto" | jq -r '.execucao.coletadoEm // empty' 2>/dev/null || true)
            if [ -n "$agora" ] && [ "$agora" != "$ANTES" ]; then
              echo "Nova coleta publicada: $agora (antes: ${ANTES:-desconhecida})"
              printf '%s' "$manifesto" | jq '{coletadoEm: .execucao.coletadoEm, modo: .execucao.modo, requisicoes: .execucao.requisicoes, avisos: .execucao.avisos, totais}'
              exit 0
            fi
            echo "Ainda não ($i/11)..."
          done
          echo "::error::A coleta publicada não mudou em 33 minutos. O build pode ter falhado (a Vercel mantém a versão anterior). Veja o painel da Vercel."
          exit 1
